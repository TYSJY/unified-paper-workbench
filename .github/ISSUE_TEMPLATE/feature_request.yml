name: Feature request / 功能建议
description: Describe a concrete writing or workflow problem
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve? / 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议的操作方式
